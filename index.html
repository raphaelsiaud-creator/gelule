<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gélule">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f5f3">
<meta name="robots" content="noindex">
<title>Gélule</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="stylesheet" href="gelule-style.css">
<style>[hidden]{display:none!important}</style>
</head>
<body>

<section id="accueil" class="accueil" hidden>
  <img class="icone-appli" src="icone-180.png" alt="">
  <h1>Gélule</h1>
  <p>Entrez le code familial pour accéder à l'appli.</p>
  <form id="formCode" style="width:100%;max-width:420px">
    <label class="champ-etiquette" for="champCode">Code familial</label>
    <input id="champCode" class="champ" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <p id="erreurCode" class="discret" style="color:var(--alerte);min-height:20px"></p>
    <button class="bouton bouton-principal" style="width:100%" type="submit">Entrer</button>
  </form>
</section>

<div id="appli" hidden>
  <header class="entete">
    <h1 id="titreEcran">Mes prises</h1>
    <button id="reessayer" class="bouton-rond" hidden aria-label="Réessayer">
      <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg>
    </button>
  </header>
  <p id="message" class="discret" role="alert" hidden style="padding:8px 18px 0;color:var(--alerte)"></p>
  <main id="contenu" class="page" style="padding-top:12px"></main>

  <nav class="barre-onglets" aria-label="Navigation">
    <a class="onglet" href="#prises" data-onglet="prises">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>
      <span>Mes prises</span>
    </a>
    <a class="onglet" href="#reserve" data-onglet="reserve">
      <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="3"/><path d="M4 10h16"/></svg>
      <span>Ma réserve</span>
    </a>
    <a class="onglet" href="#plan" data-onglet="plan">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h10M4 17h7"/></svg>
      <span>Mon plan</span>
    </a>
    <a class="onglet" href="#suivi" data-onglet="suivi">
      <svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>
      <span>Suivi médical</span>
    </a>
  </nav>
</div>

<dialog id="dlg"><div id="dlgContenu"></div></dialog>

<script>
/* ==========================================================================
   Gélule : page (JavaScript sans bibliothèque)
   ========================================================================== */

const API = 'https://script.google.com/macros/s/AKfycbwR5xArJMSMdT_j3YHImacqCsWdNAsSMOfuatGHyDUQAIhWSNXTP6pUntLJJDYsFq8/exec';

const CLE_CACHE = 'gelule-cache';
const CLE_CODE = 'gelule-code';
const MOMENTS = { matin: 'Matin', soir: 'Après-midi' };
const MOMENTS_LIST = ['matin', 'soir'];
const GRAMMAGES_LIST = [20, 10];
const TITRES = { prises: 'Mes prises', reserve: 'Ma réserve', plan: 'Mon plan', suivi: 'Mon suivi médical' };

const memoire = {};
let donnees = null;
let derniereMaj = 0;
let dernierChargement = 0;
let file = Promise.resolve();
let dateVue = null; // null = aujourd'hui

const $ = s => document.querySelector(s);

// ---------- Stockage local (repli en mémoire) ----------

function lire(k) {
  try { return localStorage.getItem(k); } catch (e) { return memoire[k] ?? null; }
}
function ecrire(k, v) {
  try { localStorage.setItem(k, v); } catch (e) { memoire[k] = v; }
}

// ---------- Texte et dates ----------

function esc(t) {
  return String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function parseDate(s) {
  const [a, m, j] = s.split('-').map(Number);
  return new Date(a, m - 1, j);
}
function iso(d) {
  return [d.getFullYear(), String(d.getMonth() + 1).padStart(2, '0'), String(d.getDate()).padStart(2, '0')].join('-');
}
function ajouterJours(s, n) {
  const d = parseDate(s);
  d.setDate(d.getDate() + n);
  return iso(d);
}
function joursEntre(a, b) {
  return Math.round((parseDate(b) - parseDate(a)) / 86400000);
}
function joliDate(s) {
  return parseDate(s).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}
function dateCourante() {
  return dateVue || donnees.aujourdhui;
}
function estAujourdhui() {
  return dateCourante() === donnees.aujourdhui;
}

// ---------- Calculs (à partir des données du Sheet) ----------

function planActuel(moment, date) {
  let choisi = null;
  donnees.Plans.forEach(p => {
    if (p.moment === moment && p.date_debut <= date && (!choisi || p.date_debut >= choisi.date_debut)) choisi = p;
  });
  return choisi;
}
function prescriptionActuelle() {
  let c = null;
  donnees.Prescriptions.forEach(p => { if (!c || p.date_debut >= c.date_debut) c = p; });
  return c;
}
// Seules les gélules marquées « Pris » sont retirées de la réserve
function consomme(g) {
  return donnees.Prises.filter(p => p.statut === 'pris' && p.grammage === g).reduce((s, p) => s + p.quantite, 0);
}
function entrees(g) {
  return donnees.Stock.filter(s => s.grammage === g).reduce((s, x) => s + x.quantite, 0);
}
function reste(g) {
  return Math.max(entrees(g) - consomme(g), 0);
}
function parJour(g) {
  return MOMENTS_LIST.reduce((s, m) => {
    const p = planActuel(m, donnees.aujourdhui);
    return s + (p ? (g === 20 ? p.g20 : p.g10) : 0);
  }, 0);
}
function joursRestants() {
  let min = Infinity;
  GRAMMAGES_LIST.forEach(g => {
    const r = parJour(g);
    if (r > 0) min = Math.min(min, Math.floor(reste(g) / r));
  });
  return min === Infinity ? null : min;
}
function premierJour() {
  const dates = donnees.Prescriptions.map(p => p.date_debut).sort();
  return dates.length ? dates[0] : donnees.aujourdhui;
}
function libelleStatut(s) {
  if (s === 'pris') return 'Pris';
  if (s === 'saute') return 'Pas pris';
  return 'À prendre';
}
function detail(g20, g10) {
  const m = [];
  if (g20) m.push(g20 + ' × 20 mg');
  if (g10) m.push(g10 + ' × 10 mg');
  return m.join(' + ') || 'Rien';
}

// ---------- Communication avec le serveur ----------

function erreur(m, codeInvalide) {
  const e = new Error(m);
  if (codeInvalide) e.codeInvalide = true;
  return e;
}

async function envoyer(action, args = {}, code = lire(CLE_CODE)) {
  let rep;
  try {
    rep = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ code, action, args })
    });
  } catch (e) {
    throw erreur('Connexion impossible. Vérifiez votre réseau et réessayez.');
  }
  let json;
  try {
    json = await rep.json();
  } catch (e) {
    throw erreur('Réponse inattendue du serveur. Vérifiez que le déploiement est en accès « Tout le monde ».');
  }
  if (!json.ok) {
    if (json.erreur === 'CODE_INVALIDE') throw erreur('Code refusé.', true);
    if (json.erreur === 'STOCK_INSUFFISANT') throw erreur('Pas assez de gélules dans la réserve pour cette prise.');
    throw erreur('Le serveur n’a pas pu enregistrer. Vos données ont été rechargées.');
  }
  return json.data;
}

// File d'appels séquentielle : une requête à la fois
function appeler(action, args) {
  const r = file.then(() => envoyer(action, args));
  file = r.catch(() => {});
  return r;
}

async function charger() {
  const id = ++dernierChargement;
  try {
    const d = await appeler('donnees');
    if (id !== dernierChargement) return; // un chargement plus récent a été lancé
    donnees = d;
    derniereMaj = Date.now();
    ecrire(CLE_CACHE, JSON.stringify(d));
    $('#message').hidden = true;
    $('#reessayer').hidden = true;
    rendre();
  } catch (e) {
    if (e.codeInvalide) {
      ecrire(CLE_CODE, '');
      montrerAccueil('Code refusé. Entrez-le à nouveau.');
      return;
    }
    afficherErreur(e.message);
    if (donnees) $('#reessayer').hidden = false;
  }
}

// Mise à jour optimiste, puis enregistrement ; en cas d'échec, rechargement
async function enregistrer(action, args, appliquer) {
  if (appliquer) appliquer();
  rendre();
  try {
    await appeler(action, args);
  } catch (e) {
    afficherErreur(e.message);
    if (e.codeInvalide) { ecrire(CLE_CODE, ''); montrerAccueil('Code refusé. Entrez-le à nouveau.'); return; }
    await charger();
  }
}

function afficherErreur(texte) {
  const m = $('#message');
  m.textContent = texte;
  m.hidden = false;
}

// ---------- Affichage des écrans ----------

function montrerAppli() { $('#accueil').hidden = true; $('#appli').hidden = false; }
function montrerAccueil(msg) {
  $('#appli').hidden = true;
  $('#accueil').hidden = false;
  $('#erreurCode').textContent = msg || '';
}

function ecranCourant() {
  const h = location.hash.replace('#', '');
  return TITRES[h] ? h : 'prises';
}

function rendre() {
  if (!donnees) return;
  const e = ecranCourant();
  $('#titreEcran').textContent = TITRES[e];
  document.querySelectorAll('.onglet').forEach(a => {
    if (a.dataset.onglet === e) a.setAttribute('aria-current', 'page');
    else a.removeAttribute('aria-current');
  });
  const rendus = { prises: rendrePrises, reserve: rendreReserve, plan: rendrePlan, suivi: rendreSuivi };
  $('#contenu').innerHTML = rendus[e]();
}


function rendrePrises() {
  const t = dateCourante();
  const aujourdhui = estAujourdhui();
  const dispo = !aujourdhui;
  let mgPrevus = 0;
  let mgPris = 0;

  const blocs = MOMENTS_LIST.map(m => {
    const plan = planActuel(m, t);
    const lignes = GRAMMAGES_LIST.map(g => {
      const prevu = plan ? (g === 20 ? plan.g20 : plan.g10) : 0;
      const prise = donnees.Prises.find(x => x.date === t && x.moment === m && x.grammage === g);
      const statut = prise ? prise.statut : '';
      const quantite = prise ? prise.quantite : (prevu > 0 ? Math.min(prevu, 5) : 1);
      mgPrevus += prevu * g;
      if (statut === 'pris') mgPris += prise.quantite * g;
      const options = [1, 2, 3, 4, 5].map(n =>
        `<option value="${n}" ${n === quantite ? 'selected' : ''}>${n}</option>`).join('');
      let texte = 'À prendre';
      if (statut === 'pris') texte = `Pris : ${quantite} gélule${quantite > 1 ? 's' : ''}`;
      if (statut === 'saute') texte = 'Pas pris';
      const attr = dispo ? 'disabled' : '';
      return `<div class="ligne ligne-prise${statut === 'pris' ? ' fait' : ''}">
        <div class="ligne-haut">
          <span class="nom-gelule">Gélules de ${g} mg</span>
          <label class="quantite-choix"><span class="discret">Nombre</span>
            <select class="champ quantite" data-moment="${m}" data-grammage="${g}" ${attr}>${options}</select>
          </label>
        </div>
        <div class="ligne-bas">
          <span class="discret">${texte}</span>
          <div class="segments">
            <button class="segment" data-action="statut" data-moment="${m}" data-grammage="${g}" data-statut="pris" aria-pressed="${statut === 'pris'}" ${attr}>Pris</button>
            <button class="segment" data-action="statut" data-moment="${m}" data-grammage="${g}" data-statut="saute" aria-pressed="${statut === 'saute'}" ${attr}>Pas pris</button>
          </div>
        </div>
      </div>`;
    }).join('');
    return `<section class="section">
      <h2 class="titre-section">${MOMENTS[m]}</h2>
      <div class="liste">${lignes}</div>
    </section>`;
  }).join('');

  const complet = mgPrevus > 0 && mgPris >= mgPrevus;
  return `
    <section class="section">
      <button class="carte-principale bulle-centree bulle-bouton" data-action="choisir-jour" aria-label="Choisir un autre jour">
        <div class="jour">${esc(parseDate(t).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }))}</div>
        <div class="chiffre">${mgPris} mg sur ${mgPrevus} mg</div>
        ${complet ? '<div class="precision">Le traitement du jour est complet.</div>' : ''}
      </button>
      <input type="date" id="choixJour" value="${t}" min="${premierJour()}" max="${donnees.aujourdhui}" hidden>
      ${dispo ? `<p class="discret" style="text-align:center;margin:10px 0 0">Journée passée, consultation seulement.
        <button class="lien" data-action="jour-aujourdhui">Revenir à aujourd’hui</button></p>` : ''}
    </section>
    ${blocs || '<p class="discret">Aucun plan en cours.</p>'}`;
}

function rendreReserve() {
  const t = donnees.aujourdhui;
  const jr = joursRestants();
  let phrase = 'Aucun plan en cours.';
  if (jr === 0) phrase = 'Il ne vous reste plus de gélules pour le traitement.';
  else if (jr !== null) phrase = `Il vous reste ${jr} jour${jr > 1 ? 's' : ''} de traitement, jusqu’au ${joliDate(ajouterJours(t, jr - 1))}.`;

  const lignes = GRAMMAGES_LIST.map(g => `
    <div class="ligne">
      <span class="libelle">Gélules de ${g} mg</span>
      <span class="grand-chiffre">${reste(g)}</span>
    </div>`).join('');

  const recents = donnees.Stock.slice().sort((a, b) => (a.date < b.date ? 1 : -1)).slice(0, 10)
    .map(s => `
      <div class="ligne">
        <span class="libelle"><span>${s.quantite} gélules de ${s.grammage} mg</span>
          <span class="discret" style="display:block">${esc(joliDate(s.date))} · ${esc(s.motif)}</span></span>
        <button class="bouton bouton-supprimer" data-action="suppr-stock" data-id="${esc(s.id)}">Supprimer</button>
      </div>`).join('');

  return `
    <section class="section">
      <div class="carte-principale bulle-centree">
        <div>${esc(phrase)}</div>
      </div>
    </section>
    <section class="section">
      <h2 class="titre-section">Dans la boîte</h2>
      <div class="liste">${lignes}</div>
      <p class="discret" style="margin:8px 4px 0">Chaque prise marquée « Pris » retire automatiquement les gélules correspondantes.</p>
    </section>
    <section class="section">
      <button class="bouton bouton-principal" style="width:100%" data-action="ajout-stock">Ajouter des gélules</button>
    </section>
    <section class="section">
      <h2 class="titre-section">Derniers ajouts</h2>
      <div class="liste">${recents || '<div class="ligne discret">Aucun ajout pour le moment.</div>'}</div>
    </section>`;
}

function rendrePlan() {
  const t = donnees.aujourdhui;
  const lignes = MOMENTS_LIST.map(m => {
    const p = planActuel(m, t);
    if (!p) return '';
    return `<div class="ligne">
      <span class="libelle">${MOMENTS[m]}</span>
      <span class="valeur">${detail(p.g20, p.g10)} · ${p.g20 * 20 + p.g10 * 10} mg</span>
    </div>`;
  }).join('');

  const historique = donnees.Plans.slice()
    .sort((a, b) => (a.date_debut < b.date_debut ? 1 : -1))
    .slice(0, 20)
    .map(p => `<div class="ligne">
      <span class="libelle"><span>${esc(joliDate(p.date_debut))} · ${MOMENTS[p.moment]}</span>
        <span class="discret" style="display:block">${detail(p.g20, p.g10)} — ${esc(p.motif)}</span></span>
      <button class="croix-supprimer" data-action="suppr-plan" data-id="${esc(p.id)}" aria-label="Supprimer ce changement">×</button>
    </div>`).join('');

  return `
    <section class="section">
      <h2 class="titre-section">Plan actuel</h2>
      <div class="liste">${lignes}</div>
      <button class="bouton bouton-principal" style="width:100%;margin-top:16px" data-action="modifier-plan">Modifier le plan</button>
    </section>
    <section class="section">
      <h2 class="titre-section">Historique des changements</h2>
      <div class="liste">${historique || '<div class="ligne discret">Aucun changement.</div>'}</div>
    </section>`;
}

function rendreSuivi() {
  const t = donnees.aujourdhui;
  const p = prescriptionActuelle();
  let bloc = '<p class="discret">Aucune ordonnance enregistrée.</p>';

  if (p) {
    const fin = ajouterJours(p.date_debut, p.duree - 1);
    const jr = joursRestants();
    const finStock = jr !== null && jr > 0 ? ajouterJours(t, jr - 1) : t;
    const limite = finStock < fin ? finStock : fin;
    const restant = joursEntre(t, limite);
    let rappel;
    if (restant < 0) {
      rappel = 'Le traitement est arrivé à son terme. Pensez à prendre rendez-vous avec votre psychiatre pour la suite.';
    } else if (restant <= 14) {
      rappel = `Pensez à prendre rendez-vous avec votre psychiatre : il reste environ ${restant} jour${restant > 1 ? 's' : ''} de traitement.`;
    } else {
      rappel = 'Tout est en ordre pour le moment.';
    }
    bloc = `
      <div class="carte">
        <div style="font-weight:600">Ordonnance en cours</div>
        <p class="discret" style="margin:6px 0 0">Du ${esc(joliDate(p.date_debut))} au ${esc(joliDate(fin))}</p>
        <p style="margin:6px 0 0">${p.g20} gélules de 20 mg et ${p.g10} gélules de 10 mg, pour ${p.duree} jours.</p>
        <p style="margin:12px 0 0">${esc(rappel)}</p>
        <button class="bouton bouton-secondaire" style="width:100%;margin-top:14px" data-action="nouvelle-ordonnance">Ajouter une nouvelle ordonnance</button>
      </div>`;
  }

  const sautees = donnees.Prises.filter(x => x.statut === 'saute')
    .sort((a, b) => (a.date < b.date ? 1 : -1))
    .slice(0, 20)
    .map(x => `<div class="ligne">
      <span class="libelle"><span>${esc(joliDate(x.date))} · ${MOMENTS[x.moment]}</span>
        <span class="discret" style="display:block">${x.quantite} gélule${x.quantite > 1 ? 's' : ''} de ${x.grammage} mg non prise${x.quantite > 1 ? 's' : ''}</span></span>
    </div>`).join('');

  const notes = donnees.Notes.slice().sort((a, b) => (a.date < b.date ? 1 : -1))
    .map(n => `<div class="ligne" style="align-items:flex-start">
      <span class="libelle"><span style="white-space:pre-wrap">${esc(n.texte)}</span>
        <span class="discret" style="display:block">${esc(joliDate(n.date))}</span></span>
      <button class="bouton bouton-supprimer" data-action="suppr-note" data-id="${esc(n.id)}">Supprimer</button>
    </div>`).join('');

  return `
    <section class="section">
      <h2 class="titre-section">Ordonnance</h2>
      ${bloc}
    </section>
    <section class="section">
      <h2 class="titre-section">Prises non prises (suivi)</h2>
      <div class="liste">${sautees || '<div class="ligne discret">Aucune prise non prise pour le moment.</div>'}</div>
    </section>
    <section class="section">
      <h2 class="titre-section">Notes pour le rendez-vous</h2>
      <div class="carte">
        <label class="champ-etiquette" for="champNote">Comment vous sentez-vous, effets, questions à poser…</label>
        <textarea id="champNote" class="champ" rows="3"></textarea>
        <button class="bouton bouton-principal" style="width:100%;margin-top:12px" data-action="ajout-note">Ajouter la note</button>
      </div>
      <div class="liste" style="margin-top:16px">${notes || '<div class="ligne discret">Aucune note pour le moment.</div>'}</div>
    </section>`;
}

// ---------- Fenêtres de saisie ----------

function ouvrirFormulaire(titre, champs, valider) {
  const dlg = $('#dlg');
  const html = champs.map(c => {
    const id = 'c_' + c.nom;
    let input;
    if (c.options) {
      input = `<select class="champ" id="${id}">${c.options.map(o =>
        `<option value="${esc(o.v)}" ${o.v === c.valeur ? 'selected' : ''}>${esc(o.l)}</option>`).join('')}</select>`;
    } else {
      input = `<input class="champ" id="${id}" type="${c.type || 'text'}" value="${esc(c.valeur ?? '')}"
        ${c.inputmode ? `inputmode="${c.inputmode}"` : ''} autocomplete="off">`;
    }
    return `<div style="margin-bottom:14px"><label class="champ-etiquette" for="${id}">${esc(c.label)}</label>${input}</div>`;
  }).join('');

  $('#dlgContenu').innerHTML = `
    <h2 style="font-size:18px;font-weight:600;margin:0 0 16px;text-align:center">${esc(titre)}</h2>
    <form id="fdlg">
      ${html}
      <p id="erreurDlg" class="discret" style="color:var(--alerte);min-height:18px;text-align:center"></p>
      <div style="display:flex;gap:10px">
        <button type="button" class="bouton bouton-secondaire" id="annuler" style="flex:1">Annuler</button>
        <button class="bouton bouton-principal" style="flex:1">Enregistrer</button>
      </div>
    </form>`;

  $('#annuler').onclick = () => dlg.close();
  $('#fdlg').onsubmit = e => {
    e.preventDefault();
    const v = {};
    champs.forEach(c => { v[c.nom] = $('#c_' + c.nom).value; });
    const err = valider(v);
    if (err) { $('#erreurDlg').textContent = err; return; }
    dlg.close();
  };
  dlg.showModal();
}

function ouvrirAjoutStock() {
  ouvrirFormulaire('Ajouter des gélules', [
    { nom: 'grammage', label: 'Dosage', options: [{ v: '20', l: '20 mg' }, { v: '10', l: '10 mg' }], valeur: '20' },
    { nom: 'quantite', label: 'Nombre de gélules', inputmode: 'numeric' },
    { nom: 'date', label: 'Date', type: 'date', valeur: donnees.aujourdhui },
    { nom: 'motif', label: 'Pourquoi', options: [
      { v: 'Nouvelle ordonnance', l: 'Nouvelle ordonnance' },
      { v: 'Retrouvée', l: 'Retrouvées' },
      { v: 'Autre', l: 'Autre' }
    ], valeur: 'Nouvelle ordonnance' }
  ], v => {
    const q = parseInt(v.quantite, 10);
    if (!(q > 0)) return 'Indiquez un nombre de gélules.';
    if (!v.date) return 'Indiquez la date.';
    const grammage = Number(v.grammage);
    enregistrer('ajouterStock', { grammage, quantite: q, date: v.date, motif: v.motif }, () => {
      donnees.Stock.push({ id: 'tmp-' + Date.now(), date: v.date, grammage, quantite: q, motif: v.motif, note: '' });
    });
  });
}

function ouvrirModifierPlan() {
  const t = donnees.aujourdhui;
  const pm = planActuel('matin', t) || { g20: 0, g10: 0 };
  const ps = planActuel('soir', t) || { g20: 0, g10: 0 };
  ouvrirFormulaire('Modifier le plan', [
    { nom: 'm20', label: 'Matin : gélules de 20 mg', inputmode: 'numeric', valeur: pm.g20 },
    { nom: 'm10', label: 'Matin : gélules de 10 mg', inputmode: 'numeric', valeur: pm.g10 },
    { nom: 's20', label: 'Après-midi : gélules de 20 mg', inputmode: 'numeric', valeur: ps.g20 },
    { nom: 's10', label: 'Après-midi : gélules de 10 mg', inputmode: 'numeric', valeur: ps.g10 },
    { nom: 'date', label: 'À partir du', type: 'date', valeur: t },
    { nom: 'motif', label: 'Pourquoi ce changement' },
    { nom: 'auteur', label: 'Décidé par' }
  ], v => {
    const nombres = ['m20', 'm10', 's20', 's10'].map(k => parseInt(v[k], 10));
    if (nombres.some(x => isNaN(x) || x < 0)) return 'Indiquez un nombre (0 ou plus) pour chaque case.';
    if (!v.date) return 'Indiquez la date du changement.';
    if (!v.motif.trim()) return 'Expliquez le changement dans « Pourquoi ce changement ».';
    const plans = [
      { moment: 'matin', g20: nombres[0], g10: nombres[1] },
      { moment: 'soir', g20: nombres[2], g10: nombres[3] }
    ];
    enregistrer('changerPlan', { date: v.date, motif: v.motif.trim(), auteur: v.auteur.trim(), plans }, () => {
      plans.forEach(p => donnees.Plans.push({
        id: 'tmp-' + p.moment + Date.now(), date_debut: v.date, motif: v.motif.trim(), decide_par: v.auteur.trim(), ...p
      }));
    });
  });
}

function ouvrirNouvelleOrdonnance() {
  ouvrirFormulaire('Nouvelle ordonnance', [
    { nom: 'date', label: 'Date de début', type: 'date', valeur: donnees.aujourdhui },
    { nom: 'duree', label: 'Durée (jours)', inputmode: 'numeric', valeur: '28' },
    { nom: 'g20', label: 'Gélules de 20 mg', inputmode: 'numeric', valeur: '28' },
    { nom: 'g10', label: 'Gélules de 10 mg', inputmode: 'numeric', valeur: '56' },
    { nom: 'stock', label: 'Ajouter ces gélules à la réserve ?', options: [
      { v: 'oui', l: 'Oui' }, { v: 'non', l: 'Non' }
    ], valeur: 'oui' }
  ], v => {
    const duree = parseInt(v.duree, 10);
    const g20 = parseInt(v.g20, 10);
    const g10 = parseInt(v.g10, 10);
    if (!v.date) return 'Indiquez la date de début.';
    if (!(duree > 0) || isNaN(g20) || isNaN(g10) || g20 < 0 || g10 < 0) return 'Vérifiez les nombres saisis.';
    const ajouterStock = v.stock === 'oui';
    enregistrer('nouvellePrescription', { date_debut: v.date, duree, g20, g10, ajouterStock }, () => {
      donnees.Prescriptions.push({ id: 'tmp-' + Date.now(), date_debut: v.date, duree, g20, g10, note: '' });
      if (ajouterStock) {
        if (g20 > 0) donnees.Stock.push({ id: 'tmp-s20-' + Date.now(), date: v.date, grammage: 20, quantite: g20, motif: 'Nouvelle ordonnance', note: '' });
        if (g10 > 0) donnees.Stock.push({ id: 'tmp-s10-' + Date.now(), date: v.date, grammage: 10, quantite: g10, motif: 'Nouvelle ordonnance', note: '' });
      }
    });
  });
}

// ---------- Actions de l'utilisateur ----------

// Nombre de gélules choisi : enregistre la prise comme « Pris » avec ce nombre
function enregistrerQuantite(sel) {
  if (!estAujourdhui()) return;
  const t = donnees.aujourdhui;
  const m = sel.dataset.moment;
  const g = Number(sel.dataset.grammage);
  const q = Number(sel.value);
  enregistrer('enregistrerPrise', { date: t, moment: m, grammage: g, statut: 'pris', quantite: q }, () => {
    donnees.Prises = donnees.Prises.filter(x => !(x.date === t && x.moment === m && x.grammage === g));
    donnees.Prises.push({ id: 'tmp-' + m + g + Date.now(), date: t, moment: m, grammage: g, quantite: q, statut: 'pris' });
  });
}

// Touche « Pris » ou « Pas pris ». Toucher à nouveau le choix déjà actif l'annule.
function changerStatut(b) {
  if (!estAujourdhui()) return;
  const t = donnees.aujourdhui;
  const m = b.dataset.moment;
  const g = Number(b.dataset.grammage);
  const demande = b.dataset.statut;
  const actuelle = donnees.Prises.find(x => x.date === t && x.moment === m && x.grammage === g);
  const statut = actuelle && actuelle.statut === demande ? '' : demande;
  const sel = document.querySelector(`select.quantite[data-moment="${m}"][data-grammage="${g}"]`);
  const q = sel ? Number(sel.value) : 1;
  enregistrer('enregistrerPrise', { date: t, moment: m, grammage: g, statut, quantite: q }, () => {
    donnees.Prises = donnees.Prises.filter(x => !(x.date === t && x.moment === m && x.grammage === g));
    if (statut) donnees.Prises.push({ id: 'tmp-' + m + g + Date.now(), date: t, moment: m, grammage: g, quantite: q, statut });
  });
}

function choisirJour() {
  const champ = $('#choixJour');
  if (champ.showPicker) champ.showPicker(); else champ.click();
}

function ajouterNoteDepuisChamp() {
  const champ = $('#champNote');
  const texte = champ.value.trim();
  if (!texte) return;
  champ.value = '';
  const date = donnees.aujourdhui;
  enregistrer('ajouterNote', { date, texte, auteur: '' }, () => {
    donnees.Notes.push({ id: 'tmp-' + Date.now(), date, texte, auteur: '' });
  });
}

function supprimerElement(table, id) {
  if (!confirm('Supprimer cette ligne ?')) return;
  enregistrer('supprimer', { table, ids: [id] }, () => {
    donnees[table] = donnees[table].filter(x => x.id !== id);
  });
}

const ACTIONS_UI = {
  'statut': changerStatut,
  'choisir-jour': choisirJour,
  'jour-aujourdhui': () => { dateVue = null; rendre(); },
  'ajout-stock': ouvrirAjoutStock,
  'modifier-plan': ouvrirModifierPlan,
  'nouvelle-ordonnance': ouvrirNouvelleOrdonnance,
  'ajout-note': ajouterNoteDepuisChamp,
  'suppr-note': b => supprimerElement('Notes', b.dataset.id),
  'suppr-stock': b => supprimerElement('Stock', b.dataset.id),
  'suppr-plan': b => supprimerElement('Plans', b.dataset.id)
};

// ---------- Démarrage et événements ----------

function demarrer() {
  const cache = lire(CLE_CACHE);
  if (cache) {
    try { donnees = JSON.parse(cache); } catch (e) { donnees = null; }
  }
  if (!lire(CLE_CODE)) { montrerAccueil(); return; }
  montrerAppli();
  rendre();
  charger();
}

$('#formCode').addEventListener('submit', async e => {
  e.preventDefault();
  const code = $('#champCode').value.trim();
  $('#erreurCode').textContent = 'Vérification…';
  try {
    const d = await envoyer('donnees', {}, code);
    ecrire(CLE_CODE, code);
    donnees = d;
    derniereMaj = Date.now();
    ecrire(CLE_CACHE, JSON.stringify(d));
    montrerAppli();
    rendre();
  } catch (err) {
    $('#erreurCode').textContent = err.codeInvalide ? 'Code refusé. Vérifiez-le et réessayez.' : err.message;
  }
});

$('#contenu').addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b || b.disabled) return;
  const f = ACTIONS_UI[b.dataset.action];
  if (f) f(b);
});

$('#contenu').addEventListener('change', e => {
  if (e.target.id !== 'choixJour' || !e.target.value) return;
  const choisi = e.target.value;
  dateVue = choisi === donnees.aujourdhui ? null : choisi;
  rendre();
});

$('#contenu').addEventListener('change', e => {
  const sel = e.target.closest('select.quantite');
  if (sel) enregistrerQuantite(sel);
});

$('#reessayer').addEventListener('click', () => charger());
window.addEventListener('hashchange', () => { dateVue = null; rendre(); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && donnees && Date.now() - derniereMaj > 30000 && !$('#dlg').open) {
    charger();
  }
});

demarrer();
</script>
